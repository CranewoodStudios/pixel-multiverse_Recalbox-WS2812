buttons:
  enabled: true
  num_leds: 30
  refresh_rate: 60
  led_map:
    # Example LED mapping (coordinate [x, y] to LED index)
    # These should be configured based on your actual hardware layout
    - coord: [0, 0]
      value: 0
    - coord: [1, 0]
      value: 1
    - coord: [2, 0]
      value: 2
    - coord: [3, 0]
      value: 3
    - coord: [4, 0]
      value: 4
    - coord: [0, 1]
      value: 5
    - coord: [1, 1]
      value: 6
    - coord: [2, 1]
      value: 7
    - coord: [3, 1]
      value: 8
    - coord: [4, 1]
      value: 9
    - coord: [0, 2]
      value: 10
    - coord: [1, 2]
      value: 11
    - coord: [2, 2]
      value: 12
    - coord: [3, 2]
      value: 13
    - coord: [4, 2]
      value: 14
    - coord: [0, 3]
      value: 15
    - coord: [1, 3]
      value: 16
    - coord: [2, 3]
      value: 17
    - coord: [3, 3]
      value: 18
    - coord: [4, 3]
      value: 19
    - coord: [0, 4]
      value: 20
    - coord: [1, 4]
      value: 21
    - coord: [2, 4]
      value: 22
    - coord: [3, 4]
      value: 23
    - coord: [4, 4]
      value: 24
    - coord: [0, 5]
      value: 25
    - coord: [1, 5]
      value: 26
    - coord: [2, 5]
      value: 27
    - coord: [3, 5]
      value: 28
    - coord: [4, 5]
      value: 29
  attract_program:
    - pattern: linear
      params:
        direction: left_to_right
        color_on: [0, 0, 255, 40]  # b, g, r, br
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: linear
      params:
        direction: right_to_left
        color_on: [255, 0, 0, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: linear
      params:
        direction: top_to_bottom
        color_on: [0, 255, 0, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: linear
      params:
        direction: bottom_to_top
        color_on: [255, 255, 0, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: radial
      params:
        direction: clockwise
        color_on: [0, 255, 255, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: radial
      params:
        direction: anticlockwise
        color_on: [255, 0, 255, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: circular
      params:
        direction: outward
        color_on: [128, 128, 128, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
    - pattern: circular
      params:
        direction: inward
        color_on: [255, 128, 64, 40]
        color_off: [0, 0, 0, 0]
        delay: 0.05
